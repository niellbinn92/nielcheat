<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Order NIELofc</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Poppins', sans-serif;color:#fff;overflow-x:hidden;background:#050A14;}
h1,h2{font-family:'Orbitron', sans-serif;}
.bg-anim{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;
  background: radial-gradient(circle at 20% 20%, #2563EB33 0%, transparent 50%),
              radial-gradient(circle at 80% 80%, #3B82F633 0%, transparent 50%),#050A14;
  animation:bgMove 15s ease-in-out infinite alternate;}
@keyframes bgMove{0%{background-position:0% 0%, 100% 100%;}100%{background-position:100% 100%, 0% 0%;}}
.card{background:#0F172A90;backdrop-filter:blur(10px);border:1px solid #2563EB;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 0 15px #2563EB40}
.input{background:#050A14;border:1px solid #2563EB;border-radius:10px;padding:10px;width:100%;color:#fff;margin-bottom:10px}
.btn{padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer;transition:0.2s}
.btn:hover{transform:scale(1.03)}
.btn-tambah{background:#2563EB;width:100%}
.btn-bayar{background:#F59E0B;width:100%}
.btn-selesai{background:#10B981;width:100%}
.btn-hapus{background:#EF4444}
.btn-copy{background:#8B5CF6}
.btn-excel{background:#16A34A}
.btn-broadcast{background:#2563EB}
.btn-danger{background:#DC2626;width:100%}
.produk-btn{background:#1E293B;border:1px solid #2563EB;padding:8px 12px;border-radius:8px;margin:4px;cursor:pointer;font-size:14px}
.produk-btn.active{background:#2563EB;box-shadow:0 0 10px #2563EB}
.status{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:800}
.pending{background:#F59E0B30;color:#F59E0B}
.proses{background:#3B82F630;color:#3B82F6}
.selesai{background:#10B98130;color:#10B981}
.stat-box{background:#1E293B;border:1px solid #2563EB;border-radius:12px;padding:12px;text-align:center}
.game-tag{font-size:10px;padding:2px 6px;border-radius:6px;background:#2563EB30;color:#3B82F6;font-weight:700}
</style>
</head>
<body>
<div class="bg-anim"></div>

<div class="max-w-3xl mx-auto p-4">
  <h1 class="text-3xl font-black text-center mb-4 text-blue-400">ORDER PANEL NIELofc</h1>

  <div id="loginBox" class="card max-w-sm mx-auto">
    <h2 class="font-bold text-lg mb-3 text-center">Login Admin</h2>
    <input id="passAdmin" type="password" placeholder="Masukkan Password" class="input">
    <button onclick="loginAdmin()" class="btn btn-tambah">MASUK</button>
  </div>

  <div id="panelBox" class="hidden">
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="stat-box"><p class="text-xs text-gray-400">TOTAL ORDER</p><p id="totalAll" class="text-2xl font-bold">0</p></div>
      <div class="stat-box"><p class="text-xs text-gray-400">SELESAI</p><p id="totalSelesai" class="text-2xl font-bold text-green-400">0</p></div>
    </div>

    <div class="card">
      <h2 class="font-bold mb-3">+ Buat Order Baru</h2>
      <input id="nohp" type="text" placeholder="No WA 08xxx" class="input">
      <p class="mb-2 font-semibold">Pilih Produk:</p>
      <div id="produkList" class="flex flex-wrap mb-3"></div>
      <input id="produk" type="hidden">
      <button onclick="tambahOrder()" class="btn btn-tambah">BUAT PESAN</button>
    </div>

    <div class="card">
      <input id="searchInput" type="text" onkeyup="render()" placeholder="🔍 Cari berdasarkan No WA / Produk" class="input mb-2">
      <div class="grid grid-cols-3 gap-2">
        <button onclick="exportExcel()" class="btn btn-excel">📊 EXCEL</button>
        <button onclick="broadcastWA()" class="btn btn-broadcast">📢 BROADCAST</button>
        <button onclick="hapusSemua()" class="btn btn-danger">🗑️ HAPUS</button>
      </div>
    </div>

    <h2 class="font-bold mb-3">Daftar Pesanan</h2>
    <div id="listOrder"></div>
    <button onclick="logout()" class="btn bg-red-600 w-full mt-4">LOGOUT</button>
  </div>
</div>

<script>
const PASS_ADMIN = "220230";
const LINK_GRUP = "https://chat.whatsapp.com/I3BS5SHHTmHAms0r8Augvw";
const LINK_SALURAN = "https://whatsapp.com/channel/0029VbCXLJx9hXF9QRZdRr12";
const QRIS_URL = "https://i.ibb.co.com/DPB5VKPs/2595-C17-A-F94-C-41-FB-8-BA1-7395-FA5-DBE7-C.png";

let produkData = [
  {nama:"migul", game:"FREE FIRE"},
  {nama:"hg proxy", game:"FREE FIRE"},
  {nama:"silent cheat", game:"FREE FIRE"},
  {nama:"drip", game:"FREE FIRE"},
  {nama:"fluorite", game:"FREE FIRE"},
  {nama:"gbox/esing", game:"SERTIFIKAT IOS"},
  {nama:"king mod", game:"PUBG"},
  {nama:"solana hax", game:"PUBG"},
  {nama:"migul proxy", game:"FREE FIRE"},
  {nama:"drip proxy", game:"FREE FIRE"},
  {nama:"hg apk mod", game:"FREE FIRE"}
  // 6 PRODUK DIBAWAH INI UDAH DIHAPUS
  // prime hook, fluorite 8ball, king of shots basic/mod/premium, wizard 8ball
];

let orders = JSON.parse(localStorage.getItem('panel_orders_v10')) || [];
let produkPilih = '';

function loginAdmin(){
  if(document.getElementById('passAdmin').value == PASS_ADMIN){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('panelBox').classList.remove('hidden');
    renderProduk(); render();
  } else { alert('Password salah!'); }
}
function logout(){ location.reload(); }
function save(){ localStorage.setItem('panel_orders_v10', JSON.stringify(orders)); render(); }

function renderProduk(){
  const wrap = document.getElementById('produkList');
  wrap.innerHTML = '';
  produkData.forEach(p=>{
    wrap.innerHTML += `<button type="button" onclick="pilihProduk('${p.nama}')" class="produk-btn">${p.nama} <span class="game-tag">[${p.game}]</span></button>`;
  });
}

function pilihProduk(p){
  produkPilih = p;
  document.getElementById('produk').value = p;
  document.querySelectorAll('.produk-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}

function tambahOrder(){
  const nohp = document.getElementById('nohp').value;
  const produk = document.getElementById('produk').value;
  if(!nohp ||!produk){ alert('Lengkapi No WA dan Pilih Produk!'); return; }
  orders.unshift({id:Date.now(), nohp, produk, key:'-', status:'pending', tanggal:new Date().toLocaleString('id')});
  save();
  document.getElementById('nohp').value='';
  document.getElementById('produk').value=''; produkPilih='';
  document.querySelectorAll('.produk-btn').forEach(b=>b.classList.remove('active'));
}

function bayarWA(id){
  const o = orders.find(x=>x.id==id); o.status='proses';
  const nomor = '62' + o.nohp.replace(/[^0-9]/g,'').replace(/^0/, '');
  const pesan = `Halo 👋%0A%0AOrder *${o.produk}* sudah dibuat ✅%0A%0A💳 *SILAHKAN BAYAR DULU* via QRIS di bawah ini:%0A${QRIS_URL}%0A%0AAdmin NIELofc`;
  window.open(`https://wa.me/${nomor}?text=${pesan}`, '_blank'); 
  window.open(QRIS_URL, '_blank');
  save();
}

function sudahBayar(id){
  const o = orders.find(x=>x.id==id);
  o.status='proses';
  const nomor = '62' + o.nohp.replace(/[^0-9]/g,'').replace(/^0/, '');
  const pesan = `✅ *BUKTI BAYAR DITERIMA* ✅%0A%0AOrder *${o.produk}* sedang kami proses ya 🔥%0ATunggu 5-10 menit key akan dikirim%0A%0AAdmin NIELofc`;
  window.open(`https://wa.me/${nomor}?text=${pesan}`, '_blank'); save();
}

function selesaiWA(id){
  const o = orders.find(x=>x.id==id);
  const keyBaru = document.getElementById('keyInput'+id).value;
  if(!keyBaru){ alert('Isi key dulu!'); return; }
  o.status='selesai'; o.key=keyBaru;
  const nomor = '62' + o.nohp.replace(/[^0-9]/g,'').replace(/^0/, '');
  const pesan = `✅ *PESAN SELESAI* ✅%0A%0A*Produk:* ${o.produk}%0A*KEY AKTIF:* \`${keyBaru}\`%0A%0A⚠️ *NOTE:* 1 KEY UNTUK 1 DEVICE SAJA ‼️%0A%0A📢 *Join Grup:* ${LINK_GRUP}%0A📢 *Saluran:* ${LINK_SALURAN}%0A%0ATerima kasih 🙏💙`;
  window.open(`https://wa.me/${nomor}?text=${pesan}`, '_blank'); save();
}

function copyKey(key){ navigator.clipboard.writeText(key); alert('✅ Key berhasil di copy: ' + key); }
function hapus(id){ if(confirm('Yakin hapus?')){ orders = orders.filter(x=>x.id!=id); save(); } }
function hapusSemua(){ if(confirm('YAKIN MAU HAPUS SEMUA DATA?')){ orders = []; save(); alert('✅ Semua data berhasil dihapus'); } }

function exportExcel(){
  if(orders.length == 0){ alert('Belum ada data untuk di export'); return; }
  const data = orders.map(o => ({
    'Tanggal': o.tanggal, 'No WA': o.nohp, 'Produk': o.produk,
    'Key': o.key, 'Status': o.status
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Data Pesanan");
  XLSX.writeFile(wb, `Data-Order-NIELofc-${new Date().toISOString().slice(0,10)}.xlsx`);
}

function broadcastWA(){
  if(orders.length == 0){ alert('Belum ada data buyer'); return; }
  let pesan = prompt("Masukkan pesan broadcast:", "🔥 INFO PENTING 🔥\n\nRestock key baru sudah masuk!\nCek panel sekarang ya bosku 🙏\n\nAdmin NIELofc");
  if(pesan == null || pesan == "") return;
  let uniqueNomor = [...new Set(orders.map(o => '62' + o.nohp.replace(/[^0-9]/g,'').replace(/^0/, '')))];
  let i = 0;
  function kirimBerikutnya(){
    if(i >= uniqueNomor.length){ alert("✅ Selesai broadcast ke " + uniqueNomor.length + " nomor"); return; }
    let nomor = uniqueNomor[i];
    let url = `https://wa.me/${nomor}?text=${encodeURIComponent(pesan)}`;
    window.open(url, '_blank'); i++;
    setTimeout(() => {
      if(confirm(`Sudah kirim ke ${i}/${uniqueNomor.length} orang. \n\nKlik OK untuk lanjut`)){ kirimBerikutnya(); }
      else { alert("Broadcast dihentikan di nomor ke " + i); }
    }, 1500);
  }
  alert(`Akan kirim ke ${uniqueNomor.length} nomor.`);
  kirimBerikutnya();
}

function render(){
  const wrap = document.getElementById('listOrder');
  const search = document.getElementById('searchInput').value.toLowerCase();
  let data = orders.filter(o => o.nohp.toLowerCase().includes(search) || o.produk.toLowerCase().includes(search));
  document.getElementById('totalAll').innerText = orders.length;
  document.getElementById('totalSelesai').innerText = orders.filter(o=>o.status=='selesai').length;

  if(data.length==0){ wrap.innerHTML='<p class="text-gray-400 text-center">Belum ada order</p>'; return; }
  wrap.innerHTML='';
  data.forEach(o=>{
    const nomor = '62' + o.nohp.replace(/[^0-9]/g,'').replace(/^0/, '');
    let statusClass = o.status=='pending'?'pending':o.status=='proses'?'proses':'selesai';
    wrap.innerHTML += `
    <div class="card">
      <div class="flex justify-between"><p class="font-bold text-lg">${o.produk}</p><span class="status ${statusClass}">${o.status}</span></div>
      <p class="text-sm">WA: <b>${o.nohp}</b></p>
      <p class="text-xs text-gray-400">${o.tanggal}</p>
      ${o.key!= '-'? `<div class="flex gap-2 mt-1 items-center"><p class="text-sm text-green-400">Key: ${o.key}</p><button onclick="copyKey('${o.key}')" class="btn btn-copy text-xs px-2 py-1">COPY</button></div>` : ''}
      <div class="mt-3 space-y-2">
        ${o.status=='pending'? `<button onclick="bayarWA(${o.id})" class="btn btn-bayar">1. KIRIM LINK PEMBAYARAN QRIS</button>` : ''}
        ${o.status=='proses'? `<button onclick="sudahBayar(${o.id})" class="btn btn-proses">SUDAH BAYAR</button>` : ''}
        ${o.status!='selesai'? `<input id="keyInput${o.id}" type="text" placeholder="Tempel Key Disini" class="input"><button onclick="selesaiWA(${o.id})" class="btn btn-selesai">2. SELESAI + KIRIM KEY</button>` : ''}
        <a href="https://wa.me/${nomor}" target="_blank" class="btn" style="background:#22C55E;display:block;text-align:center">CHAT LANGSUNG</a>
        <button onclick="hapus(${o.id})" class="btn btn-hapus w-full">HAPUS</button>
      </div>
    </div>`;
  });
}
</script>
</body>
</html>
