<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin WA Sender</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0a0f1e;color:#fff;font-family:Arial}
.card{background:#111827;border:1px solid #2563EB;border-radius:12px;padding:16px;margin-bottom:12px}
.input{background:#0a0f1e;border:1px solid #2563EB;border-radius:8px;padding:10px;width:100%;color:#fff;margin-bottom:10px}
.btn{padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.btn-tambah{background:#2563EB;width:100%}
.btn-proses{background:#F59E0B;width:100%}
.btn-selesai{background:#10B981;width:100%}
.btn-hapus{background:#EF4444}
</style>
</head>
<body class="p-4">

<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold text-center mb-4 text-blue-400">PANEL ADMIN WA</h1>

  <!-- FORM TAMBAH ORDER -->
  <div class="card">
    <h2 class="font-bold mb-3">+ Tambah Pesanan Baru</h2>
    <input id="nama" type="text" placeholder="Nama Pembeli" class="input">
    <input id="nohp" type="text" placeholder="No WA 08xxx" class="input">
    <input id="produk" type="text" placeholder="Nama Produk / Paket" class="input">
    <input id="key" type="text" placeholder="Key / Kode - isi nanti" class="input">
    <button onclick="tambahOrder()" class="btn btn-tambah">SIMPAN PESAN</button>
  </div>

  <!-- LIST ORDER -->
  <h2 class="font-bold mb-3">Daftar Pesanan</h2>
  <div id="listOrder"></div>
</div>

<script>
let orders = JSON.parse(localStorage.getItem('panel_orders')) || [];

function save(){ localStorage.setItem('panel_orders', JSON.stringify(orders)); render(); }

function tambahOrder(){
  const nama = document.getElementById('nama').value;
  const nohp = document.getElementById('nohp').value;
  const produk = document.getElementById('produk').value;
  const key = document.getElementById('key').value;

  if(!nama || !nohp || !produk){ alert('Nama, No WA, Produk wajib diisi!'); return; }

  orders.unshift({
    id: Date.now(),
    nama, nohp, produk, key,
    status: 'pending',
    tanggal: new Date().toLocaleString('id')
  });
  save();
  document.getElementById('nama').value = '';
  document.getElementById('nohp').value = '';
  document.getElementById('produk').value = '';
  document.getElementById('key').value = '';
}

function prosesWA(id){
  const o = orders.find(x=>x.id==id);
  o.status = 'proses';
  const nomor = '62' + o.nohp.replace(/[^0-9]/g,'').replace(/^0/, '');
  const pesan = `Halo ${o.nama} 👋%0ATerima kasih sudah order ${o.produk} ✅%0A%0APesanan kamu sedang KAMI PROSES. Mohon tunggu sebentar ya 🙏%0A- Admin`;
  window.open(`https://wa.me/${nomor}?text=${pesan}`, '_blank');
  save();
}

function selesaiWA(id){
  const o = orders.find(x=>x.id==id);
  const keyBaru = document.getElementById('keyInput'+id).value;
  if(!keyBaru){ alert('Isi key dulu!'); return; }
  o.status = 'selesai';
  o.key = keyBaru;
  const nomor = '62' + o.nohp.replace(/[^0-9]/g,'').replace(/^0/, '');
  const pesan = `Halo ${o.nama} 👋%0APesanan ${o.produk} SUDAH SELESAI ✅%0A%0AKEY: ${keyBaru}%0A%0ASilahkan digunakan. Terima kasih 🙏%0A- Admin`;
  window.open(`https://wa.me/${nomor}?text=${pesan}`, '_blank');
  save();
}

function hapus(id){
  if(confirm('Yakin hapus?')){ 
    orders = orders.filter(x=>x.id!=id); 
    save(); 
  }
}

function render(){
  const wrap = document.getElementById('listOrder');
  if(orders.length==0){ wrap.innerHTML='<p class="text-gray-400 text-center">Belum ada pesanan</p>'; return; }
  
  wrap.innerHTML = '';
  orders.forEach(o=>{
    const nomor = '62' + o.nohp.replace(/[^0-9]/g,'').replace(/^0/, '');
    wrap.innerHTML += `
    <div class="card">
      <p><b>${o.produk}</b></p>
      <p class="text-sm">Nama: ${o.nama}</p>
      <p class="text-sm">WA: ${o.nohp}</p>
      <p class="text-xs text-gray-400">${o.tanggal}</p>
      <p class="text-sm">Status: <b>${o.status}</b></p>
      ${o.key ? `<p class="text-sm text-green-400">Key: ${o.key}</p>` : ''}
      
      <div class="mt-2 space-y-2">
        ${o.status=='pending'? `<button onclick="prosesWA(${o.id})" class="btn btn-proses">1. PROSES + KIRIM WA</button>` : ''}
        
        ${o.status!='selesai'? `
        <input id="keyInput${o.id}" type="text" placeholder="Tempel Key Disini" class="input">
        <button onclick="selesaiWA(${o.id})" class="btn btn-selesai">2. SELESAI + KIRIM KEY WA</button>` : ''}
        
        <a href="https://wa.me/${nomor}" target="_blank" class="btn" style="background:#22C55E;display:block;text-align:center">CHAT LANGSUNG</a>
        <button onclick="hapus(${o.id})" class="btn btn-hapus w-full">HAPUS</button>
      </div>
    </div>`;
  });
}
render();
</script>
</body>
</html>
