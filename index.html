<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin NIELofc</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
body{background:#050A14;color:#fff;font-family:'Poppins', sans-serif}
h1{font-family:'Orbitron', sans-serif;color:#3B82F6;text-shadow:0 0 8px #3B82F6}
.card{background:#0F172A;border:1px solid #2563EB;border-radius:16px;padding:16px}
.input{background:#050A14;border:1px solid #2563EB;border-radius:10px;padding:10px;width:100%;color:#fff}
.btn{padding:10px 14px;border-radius:10px;font-weight:800}
.btn-proses{background:#2563EB}
.btn-selesai{background:#10B981}
.btn-wa{background:#22C55E}
.status{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:800}
.pending{background:#F59E0B20;color:#F59E0B}
.proses{background:#3B82F620;color:#3B82F6}
.selesai{background:#10B98120;color:#10B981}
</style>
</head>
<body class="p-4">

<div class="max-w-4xl mx-auto">
  <h1 class="text-3xl font-black text-center mb-4">PANEL ADMIN NIELofc</h1>

  <div id="loginBox" class="card max-w-sm mx-auto">
    <h2 class="font-bold text-lg mb-3">Login Admin</h2>
    <input id="passAdmin" type="password" placeholder="Password Admin" class="input mb-3">
    <button onclick="loginAdmin()" class="btn btn-proses w-full">MASUK</button>
  </div>

  <div id="panelBox" class="hidden">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">Daftar Pesanan Masuk</h2>
      <button onclick="logout()" class="btn bg-red-600">LOGOUT</button>
    </div>
    <div id="listOrder" class="space-y-4"></div>
  </div>
</div>

<script>
const PASS_ADMIN = "220230"; // ganti password disini

function loginAdmin(){
  if(document.getElementById('passAdmin').value == PASS_ADMIN){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('panelBox').classList.remove('hidden');
    renderOrder();
  } else { alert('Password salah!'); }
}

function logout(){
  document.getElementById('panelBox').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
}

function renderOrder(){
  const wrap = document.getElementById('listOrder');
  let orders = JSON.parse(localStorage.getItem('niel_orders')) || [];

  if(orders.length == 0){
    wrap.innerHTML = '<p class="text-center text-gray-400">Belum ada order masuk</p>';
    return;
  }

  wrap.innerHTML = '';
  orders.forEach((o, i)=>{
    let statusClass = o.status == 'pending'? 'pending' : o.status == 'proses'? 'proses' : 'selesai';
    let statusText = o.status == 'pending'? 'Menunggu' : o.status == 'proses'? 'Diproses' : 'Selesai';
    let nomor = '62' + o.nohp.replace(/[^0-9]/g,'').replace(/^0/, '');

    wrap.innerHTML += `
    <div class="card">
      <div class="flex justify-between items-start mb-2">
        <div>
          <p class="font-bold text-lg">${o.produk}</p>
          <p class="text-sm text-gray-400">${o.durasi} - Rp${o.harga.toLocaleString('id')}</p>
        </div>
        <span class="status ${statusClass}">${statusText}</span>
      </div>
      <p class="text-sm">Nama: <b>${o.nama}</b></p>
      <p class="text-sm">No WA: <b>${o.nohp}</b></p>
      <p class="text-xs text-gray-500">ID: ${o.id} | ${o.tanggal}</p>
      ${o.key? `<p class="text-sm text-green-400 mt-1">Key Terkirim: ${o.key}</p>` : ''}

      <div class="mt-3 space-y-2">
        ${o.status == 'pending'? `<button onclick="prosesWA(${i}, '${nomor}')" class="btn btn-proses w-full">1. PROSES + KIRIM WA</button>` : ''}

        ${o.status!= 'selesai'? `
        <div id="keyInput${i}" class="${o.status == 'proses'? '' : 'hidden'}">
          <input id="inputKey${i}" type="text" placeholder="Tempel Key Disini" class="input mb-2">
          <button onclick="selesaiWA(${i}, '${nomor}')" class="btn btn-selesai w-full">2. SELESAI + KIRIM KEY VIA WA</button>
        </div>` : ''}

        <a href="https://wa.me/${nomor}" target="_blank" class="btn btn-wa w-full block text-center">CHAT LANGSUNG KE ${o.nohp}</a>
      </div>
    </div>`;
  });
}

function prosesWA(index, nomor){
  let orders = JSON.parse(localStorage.getItem('niel_orders')) || [];
  orders[index].status = 'proses';
  localStorage.setItem('niel_orders', JSON.stringify(orders));

  const o = orders[index];
  const pesan = `Halo ${o.nama} 👋%0ATerima kasih sudah order di NIELofc ✅%0A%0ADetail Pesanan:%0AID: ${o.id}%0AProduk: ${o.produk} - ${o.durasi}%0AHarga: Rp${o.harga.toLocaleString('id')}%0A%0APesanan kamu sedang KAMI PROSES. Mohon tunggu sebentar 🙏`;
  window.open(`https://wa.me/${nomor}?text=${pesan}`, '_blank');
  renderOrder();
}

function selesaiWA(index, nomor){
  let key = document.getElementById(`inputKey${index}`).value;
  if(!key){ alert('Isi key dulu!'); return; }

  let orders = JSON.parse(localStorage.getItem('niel_orders')) || [];
  orders[index].status = 'selesai';
  orders[index].key = key;
  localStorage.setItem('niel_orders', JSON.stringify(orders));

  const o = orders[index];
  const pesan = `Halo ${o.nama} 👋%0APesanan kamu SUDAH SELESAI ✅%0A%0AID: ${o.id}%0AProduk: ${o.produk} - ${o.durasi}%0AStatus: AKTIF%0A%0AKEY: ${key}%0A%0ATutorial: Silahkan login ke aplikasi dan masukkan key diatas%0ATerima kasih sudah order di NIELofc 🙏`;
  window.open(`https://wa.me/${nomor}?text=${pesan}`, '_blank');
  renderOrder();
}

// auto refresh tiap 5 detik
setInterval(renderOrder, 5000);
</script>

</body>
</html>
